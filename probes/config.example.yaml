# AIXianlu Probe configuration example
# Copy to config.yaml and edit as needed. config.yaml is git-ignored.

probe_id: ""                      # leave empty → stable ID from device fingerprint
timeout_seconds: 12
concurrency: 6
retries: 1                        # extra attempts on transport errors
retry_backoff_seconds: 0.5        # exponential backoff base
user_agent: "aixianlu-probe/0.2.0"
geo_timeout_seconds: 5

location:
  auto_detect: false              # ask a public IP info service; only ISP/region/ASN are kept,
                                  # the IP address itself is never stored or uploaded
  isp: ""                         # 电信 / 联通 / 移动 / 其他（手动值优先于自动识别）
  region: ""                      # e.g. 广东 / 上海
  asn: null
  country: "CN"

report:
  enabled: false
  endpoint: "https://aixianlu.com/api/v1/metrics/report"
  token: ""                       # issued by the platform; used for Bearer auth + HMAC signing
  timeout_seconds: 10
  min_interval_seconds: 60        # client-side cooldown between uploads
  # state_path: "~/.cache/aixianlu-probe/state.json"

